<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megan & Brendan's Wedding Photos</title>
<style>
    :root {
        --blue-ink: #273b61;
        --blue-link: #385b91;
        --purple-accent: #684696;
        --muted-ink: #66728a;
    }

    body {
        margin: 0;
        text-align: center;
        font-family: Helvetica, Arial, sans-serif;
    }

    h1 {
        color: var(--blue-ink);
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        width: min(100%, 1200px);
        margin: 0 auto;
        padding: 0 1rem 1rem;
        box-sizing: border-box;
    }

    .video {
        width: min(100%, 1200px);
        margin: 1.5rem auto;
        padding: 0 1rem 1rem;
        box-sizing: border-box;
    }

    .video h2 {
        color: var(--blue-ink);
    }

    .video-frame {
        aspect-ratio: 16 / 9;
    }

    .video-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
    }

    .gallery section,
    .gallery a {
        height: 100%;
    }

    .gallery a {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--blue-link);
        text-decoration: none;
    }

    .gallery img {
        display: block;
        width: 100%;
        height: auto;
        margin-top: auto;
    }

    .gallery h3 {
        color: var(--blue-ink);
        margin: 0.5rem 0 0.15rem;
    }

    .gallery h4 {
        color: var(--muted-ink);
        font-weight: 400;
        margin: 0 0 1rem;
    }

    .gallery .gallery-subtitle {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        width: fit-content;
        box-sizing: border-box;
    }

    .gallery .password-required {
        margin: 0 0 1rem;
        padding: 0.65rem 0.85rem;
        border: 2px solid var(--purple-accent);
        border-radius: 6px;
        color: #fff;
        background: var(--purple-accent);
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1.35;
    }

    .password-required strong {
        font-size: 1.15em;
        letter-spacing: 0.04em;
    }

    .gallery a:hover h3 {
        color: var(--purple-accent);
        text-decoration: underline;
        text-decoration-color: var(--purple-accent);
        text-underline-offset: 0.18em;
    }

    .gallery a:focus-visible {
        outline: 2px solid var(--purple-accent);
        outline-offset: 4px;
        border-radius: 2px;
    }

    @media (max-width: 600px) {
        .gallery {
            grid-template-columns: 1fr;
        }

        .gallery .gallery-subtitle {
            min-height: 0;
        }
    }
</style>
<body>
    <h1>Megan & Brendan's Wedding Photos</h1>
    <div class="gallery">
        <section>
            <a href="https://timfullerphotography.smugmug.com/Weddings/Weddings/Megan-Brendan/n-TnrptS">
                <h3>Professional Photos from MI Catholic Wedding</h3>
                <h4 class="password-required">If asked, enter password: <strong>M&amp;B</strong></h4>
                <img src="TF3_0978-X3.jpg" alt="Professional wedding photo of the consecration">
            </a>
        </section>
        <section>
            <a href="https://photos.app.goo.gl/SAzD3uZnC5PtacY57">
                <h3>Guest Photos</h3>
                <h4 class="gallery-subtitle">Please upload your photos here!</h4>
                <img src="IMG_4447.jpg" alt="Selfie at the UM-Dearborn Fieldhouse">
            </a>
        </section>
    </div>
    <section class="video">
        <h2>Full Wedding Video Edit</h2>
        <div class="video-frame">
            <iframe
                src="https://www.youtube-nocookie.com/embed/WvDT8PkvAb0"
                title="Full Wedding Video Edit"
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
    </section>
</body>
